name: Publish page

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Five minutes before the ESP32 downloads, covering 08:00 to 19:00 UK time in
    # both GMT and BST. Cron times are UTC, and scheduled runs can start late.
    - cron: "25,55 6-18 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m dashboard
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
